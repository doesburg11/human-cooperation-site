<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Agent-environment interactions in reinforcement learning (Singh, Lewis &amp; Barto, 2009/2010, Figure 1)</title>
  <desc id="desc">Two panels. Left: the standard RL view, in which primary reward is supplied to the agent from its environment via a critic residing there. Right: an elaboration in which the environment is factored into an internal and external environment, both inside an "organism" boundary for the internal part; all reward comes from the internal environment's critic, never directly from the external world.</desc>
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d6e4f5; stroke-width: 2; }
      .label { font: 700 20px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #0f3368; }
      .box-label { font: 700 15px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #0f3368; text-anchor: middle; }
      .arrow-label { font: 700 13px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #1f2d3d; text-anchor: middle; }
      .reward-label { font: 700 13px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #a5670f; text-anchor: middle; }
      .organism-label { font: 700 13px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #0f3368; font-style: italic; text-anchor: end; }
      .muted { font: 400 12.5px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #506176; }
      .conn { fill: none; stroke: #1f2d3d; stroke-width: 2.2; }
      .reward-conn { fill: none; stroke: #c9861f; stroke-width: 2.6; }
      .lbl-bg { fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2d3d"/>
    </marker>
    <marker id="arrow-reward" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9861f"/>
    </marker>
  </defs>

  <!-- ============ PANEL 1: STANDARD VIEW ============ -->
  <rect class="panel" x="30" y="30" width="520" height="620"/>
  <text class="label" x="55" y="68">STANDARD VIEW</text>
  <line x1="55" y1="80" x2="525" y2="80" stroke="#d6e4f5" stroke-width="1.5"/>
  <text class="muted" x="55" y="104">Primary reward is supplied to the agent</text>
  <text class="muted" x="55" y="122">from its environment, via a critic residing there.</text>

  <!-- Environment box (top), Critic nested inside -->
  <rect x="180" y="250" width="220" height="90" rx="10" fill="#F2F4F7" stroke="#7a869b" stroke-width="2"/>
  <text class="box-label" x="290" y="267">Environment</text>
  <rect x="235" y="277" width="110" height="45" rx="8" fill="#FCEFD1" stroke="#c9861f" stroke-width="2"/>
  <text class="box-label" x="290" y="305" fill="#a5670f">Critic</text>

  <!-- Agent box (bottom) -->
  <rect x="180" y="460" width="220" height="90" rx="10" fill="#EAF2FB" stroke="#2266cc" stroke-width="2"/>
  <text class="box-label" x="290" y="511">Agent</text>

  <!-- Rewards: Critic -> Agent, straight down -->
  <line class="reward-conn" x1="290" y1="322" x2="290" y2="458" marker-end="url(#arrow-reward)"/>
  <rect class="lbl-bg" x="253" y="375" width="74" height="20"/>
  <text class="reward-label" x="290" y="390">Rewards</text>

  <!-- Actions: Agent -> Environment, left-side orthogonal loop -->
  <path class="conn" d="M 180 505 L 110 505 L 110 295 L 178 295" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="76" y="390" width="68" height="20"/>
  <text class="arrow-label" x="110" y="405">Actions</text>

  <!-- States: Environment -> Agent, right-side orthogonal loop -->
  <path class="conn" d="M 402 295 L 470 295 L 470 505 L 402 505" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="436" y="390" width="64" height="20"/>
  <text class="arrow-label" x="470" y="405">States</text>

  <!-- ============ PANEL 2: ORGANISM VIEW ============ -->
  <rect class="panel" x="590" y="30" width="580" height="620"/>
  <text class="label" x="615" y="68">ORGANISM VIEW</text>
  <line x1="615" y1="80" x2="1145" y2="80" stroke="#d6e4f5" stroke-width="1.5"/>
  <text class="muted" x="615" y="104">The environment is factored into internal and</text>
  <text class="muted" x="615" y="122">external parts; all reward comes from the former.</text>

  <!-- External Environment box, outside the Organism boundary -->
  <rect x="780" y="178" width="200" height="60" rx="10" fill="#F2F4F7" stroke="#7a869b" stroke-width="2"/>
  <text class="box-label" x="880" y="213">External Environment</text>

  <!-- Organism boundary (dashed), containing Agent + Internal Environment -->
  <rect x="660" y="293" width="440" height="330" rx="14" fill="#FAFBFD" stroke="#0f3368" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="organism-label" x="1090" y="613">&#8220;Organism&#8221;</text>

  <!-- Internal Environment box, Critic nested inside -->
  <rect x="740" y="323" width="280" height="90" rx="10" fill="#EEF6F3" stroke="#2f7a68" stroke-width="2"/>
  <text class="box-label" x="880" y="340" fill="#1f5e4e">Internal Environment</text>
  <rect x="820" y="350" width="120" height="45" rx="8" fill="#FCEFD1" stroke="#c9861f" stroke-width="2"/>
  <text class="box-label" x="880" y="378" fill="#a5670f">Critic</text>

  <!-- Agent box -->
  <rect x="740" y="493" width="280" height="90" rx="10" fill="#EAF2FB" stroke="#2266cc" stroke-width="2"/>
  <text class="box-label" x="880" y="544">Agent</text>

  <!-- Rewards: Critic -> Agent, straight down -->
  <line class="reward-conn" x1="880" y1="395" x2="880" y2="491" marker-end="url(#arrow-reward)"/>
  <rect class="lbl-bg" x="843" y="427" width="74" height="20"/>
  <text class="reward-label" x="880" y="442">Rewards</text>

  <!-- Decisions: Agent -> Internal Environment (inner left loop) -->
  <path class="conn" d="M 740 518 L 710 518 L 710 368 L 738 368" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="672" y="433" width="80" height="20"/>
  <text class="arrow-label" x="712" y="448">Decisions</text>

  <!-- States: Internal Environment -> Agent (inner right loop) -->
  <path class="conn" d="M 1022 388 L 1050 388 L 1050 538 L 1022 538" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="1018" y="453" width="60" height="20"/>
  <text class="arrow-label" x="1048" y="468">States</text>

  <!-- Actions: Agent -> External Environment, crosses organism boundary (outer left loop) -->
  <path class="conn" d="M 740 558 L 640 558 L 640 208 L 778 208" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="605" y="373" width="68" height="20"/>
  <text class="arrow-label" x="639" y="388">Actions</text>

  <!-- Sensations: External Environment -> Internal Environment, crosses organism boundary (outer right loop) -->
  <path class="conn" d="M 982 208 L 1120 208 L 1120 348 L 1022 348" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="1090" y="268" width="78" height="20"/>
  <text class="arrow-label" x="1129" y="283">Sensations</text>
</svg>

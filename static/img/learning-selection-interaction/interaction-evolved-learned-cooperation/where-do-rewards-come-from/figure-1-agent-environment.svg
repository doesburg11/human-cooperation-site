<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Agent-environment interactions in reinforcement learning (Singh, Lewis &amp; Barto, 2009/2010, Figure 1)</title>
  <desc id="desc">Two panels. Left: the standard RL view, in which primary reward is supplied to the agent from its environment via a critic residing there. Right: an elaboration in which the environment is factored into an internal and external environment, both inside an "organism" boundary for the internal part; all reward comes from the internal environment's critic, never directly from the external world.</desc>
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d6e4f5; stroke-width: 2; }
      .label { font: 700 20px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #0f3368; }
      .box-label { font: 700 15px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #0f3368; text-anchor: middle; }
      .box-sublabel { font: 700 12px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #506176; text-anchor: middle; }
      .arrow-label { font: 700 13px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #1f2d3d; text-anchor: middle; }
      .reward-label { font: 700 13px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #a5670f; text-anchor: middle; }
      .organism-label { font: 700 13px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #0f3368; font-style: italic; text-anchor: middle; }
      .muted { font: 400 12.5px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #506176; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2d3d"/>
    </marker>
    <marker id="arrow-reward" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9861f"/>
    </marker>
  </defs>

  <!-- ============ PANEL 1: STANDARD VIEW ============ -->
  <rect class="panel" x="30" y="30" width="540" height="500"/>
  <text class="label" x="55" y="68">STANDARD VIEW</text>
  <line x1="55" y1="80" x2="545" y2="80" stroke="#d6e4f5" stroke-width="1.5"/>
  <text class="muted" x="55" y="104">Primary reward is supplied to the agent</text>
  <text class="muted" x="55" y="122">from its environment, via a critic residing there.</text>

  <!-- Agent box -->
  <rect x="195" y="150" width="210" height="80" rx="10" fill="#EAF2FB" stroke="#2266cc" stroke-width="2"/>
  <text class="box-label" x="300" y="196">Agent</text>

  <!-- Environment box -->
  <rect x="95" y="370" width="410" height="130" rx="10" fill="#F2F4F7" stroke="#7a869b" stroke-width="2"/>
  <text class="box-label" x="180" y="398">Environment</text>

  <!-- Critic box, nested in Environment -->
  <rect x="320" y="382" width="150" height="60" rx="8" fill="#FCEFD1" stroke="#c9861f" stroke-width="2"/>
  <text class="box-label" x="395" y="418" fill="#a5670f">Critic</text>

  <!-- Actions: Agent -> Environment -->
  <line x1="255" y1="230" x2="255" y2="368" stroke="#1f2d3d" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="217" y="288" width="76" height="20" fill="#ffffff"/>
  <text class="arrow-label" x="255" y="303">Actions</text>

  <!-- States: Environment -> Agent -->
  <line x1="345" y1="368" x2="345" y2="230" stroke="#1f2d3d" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="309" y="288" width="70" height="20" fill="#ffffff"/>
  <text class="arrow-label" x="345" y="303">States</text>

  <!-- Rewards: Critic -> Agent -->
  <line x1="430" y1="382" x2="404" y2="232" stroke="#c9861f" stroke-width="2.6" marker-end="url(#arrow-reward)"/>
  <rect x="393" y="295" width="76" height="20" fill="#ffffff"/>
  <text class="reward-label" x="431" y="310">Rewards</text>

  <!-- ============ PANEL 2: ORGANISM VIEW ============ -->
  <rect class="panel" x="610" y="30" width="560" height="500"/>
  <text class="label" x="635" y="68">ORGANISM VIEW</text>
  <line x1="635" y1="80" x2="1145" y2="80" stroke="#d6e4f5" stroke-width="1.5"/>
  <text class="muted" x="635" y="104">The environment is factored into internal and</text>
  <text class="muted" x="635" y="122">external parts; all reward comes from the former.</text>

  <!-- Organism boundary (dashed), containing Agent + Internal Environment -->
  <rect x="650" y="150" width="330" height="350" rx="14" fill="#FAFBFD" stroke="#0f3368" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="organism-label" x="815" y="490">&#8220;Organism&#8221;</text>

  <!-- Agent box -->
  <rect x="700" y="180" width="230" height="80" rx="10" fill="#EAF2FB" stroke="#2266cc" stroke-width="2"/>
  <text class="box-label" x="815" y="226">Agent</text>

  <!-- Internal Environment box -->
  <rect x="700" y="330" width="230" height="140" rx="10" fill="#EEF6F3" stroke="#2f7a68" stroke-width="2"/>
  <text class="box-label" x="815" y="358" fill="#1f5e4e">Internal Environment</text>

  <!-- Critic box, nested in Internal Environment -->
  <rect x="760" y="372" width="110" height="55" rx="8" fill="#FCEFD1" stroke="#c9861f" stroke-width="2"/>
  <text class="box-label" x="815" y="405" fill="#a5670f">Critic</text>

  <!-- Decisions: Agent -> Internal Environment -->
  <line x1="775" y1="260" x2="775" y2="328" stroke="#1f2d3d" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="720" y="285" width="90" height="20" fill="#ffffff"/>
  <text class="arrow-label" x="775" y="300">Decisions</text>

  <!-- States: Internal Environment -> Agent -->
  <line x1="855" y1="328" x2="855" y2="260" stroke="#1f2d3d" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="820" y="285" width="70" height="20" fill="#ffffff"/>
  <text class="arrow-label" x="855" y="300">States</text>

  <!-- Rewards: Critic -> Agent -->
  <line x1="850" y1="372" x2="920" y2="262" stroke="#c9861f" stroke-width="2.6" marker-end="url(#arrow-reward)"/>
  <rect x="847" y="307" width="76" height="20" fill="#ffffff"/>
  <text class="reward-label" x="885" y="322">Rewards</text>

  <!-- External Environment box, outside the Organism boundary -->
  <rect x="1020" y="230" width="130" height="140" rx="10" fill="#F2F4F7" stroke="#7a869b" stroke-width="2"/>
  <text class="box-label" x="1085" y="270" style="font-size:13px">External</text>
  <text class="box-label" x="1085" y="290" style="font-size:13px">Environment</text>

  <!-- Actions: Agent -> External Environment (crosses organism boundary) -->
  <line x1="930" y1="205" x2="1018" y2="270" stroke="#1f2d3d" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="948" y="220" width="68" height="20" fill="#ffffff"/>
  <text class="arrow-label" x="982" y="235">Actions</text>

  <!-- Sensations: External Environment -> Internal Environment (crosses organism boundary) -->
  <line x1="1018" y1="330" x2="932" y2="392" stroke="#1f2d3d" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="938" y="345" width="90" height="20" fill="#ffffff"/>
  <text class="arrow-label" x="983" y="360">Sensations</text>
</svg>

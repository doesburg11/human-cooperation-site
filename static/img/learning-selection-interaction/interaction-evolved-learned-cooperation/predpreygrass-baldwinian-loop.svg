<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710" role="img" aria-labelledby="title desc">
  <title id="title">PredPreyGrass Baldwinian eco-evolutionary loop</title>
  <desc id="desc">Diagram showing inherited speed genomes shaping movement mechanics, learned policy behavior affecting ecological payoff, and reproduction passing mutated genomes but not acquired policy weights to offspring.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3368"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34785a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9b6a08"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a3f44"/>
    </marker>
    <style>
      .label { font: 700 22px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #1f2d3d; }
      .small-label { font: 700 18px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #1f2d3d; }
      .body { font: 400 18px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #1f2d3d; }
      .small { font: 400 15px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #1f2d3d; }
      .tiny { font: 400 13px "IBM Plex Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #1f2d3d; }
      .panel { fill: #ffffff; stroke: #d6e4f5; stroke-width: 2; rx: 8; }
      .panel-blue { fill: #eaf2fb; stroke: #78aae6; stroke-width: 2; rx: 8; }
      .panel-green { fill: #edf7f1; stroke: #6aa982; stroke-width: 2; rx: 8; }
      .panel-amber { fill: #fff7e3; stroke: #d9a83d; stroke-width: 2; rx: 8; }
      .panel-red { fill: #fff1f1; stroke: #d08a8d; stroke-width: 2; rx: 8; }
      .lane { fill: #f7faff; stroke: #d6e4f5; stroke-width: 1.5; rx: 8; }
      .arrow-blue { fill: none; stroke: #0f3368; stroke-width: 4; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #34785a; stroke-width: 4; marker-end: url(#arrow-green); }
      .arrow-amber { fill: none; stroke: #9b6a08; stroke-width: 4; marker-end: url(#arrow-amber); }
      .arrow-red { fill: none; stroke: #9a3f44; stroke-width: 4; marker-end: url(#arrow-red); }
      .dash-red { fill: none; stroke: #9a3f44; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow-red); }
      .no-fill { fill: none; }
      .muted { fill: #506176; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect class="lane" x="55" y="35" width="360" height="430"/>
  <rect class="lane" x="520" y="35" width="360" height="430"/>
  <rect class="lane" x="985" y="35" width="360" height="430"/>

  <text class="label" x="85" y="75">Generation g</text>
  <text class="label" x="550" y="75">Lifetime ecology and learning</text>
  <text class="label" x="1015" y="75">Generation g + 1</text>

  <rect class="panel-blue" x="90" y="105" width="290" height="110"/>
  <text class="small-label" x="115" y="142">Inherited genome</text>
  <text class="body" x="115" y="174">speed value</text>
  <text class="small" x="115" y="198">founder sample or parent genome</text>

  <rect class="panel" x="90" y="265" width="290" height="145"/>
  <text class="small-label" x="115" y="302">Trait expression</text>
  <text class="small" x="115" y="335">eco_evolutionary:</text>
  <text class="small" x="145" y="358">speed controls move distance</text>
  <text class="small" x="115" y="385">eco_evolutionary_cadence:</text>
  <text class="small" x="145" y="408">speed controls cooldown</text>

  <rect class="panel-green" x="555" y="105" width="290" height="135"/>
  <text class="small-label" x="580" y="142">Policy input</text>
  <text class="small" x="580" y="172">grid observation</text>
  <text class="small" x="580" y="197">+ speed channel</text>
  <text class="small" x="580" y="222">+ move_available in cadence</text>

  <rect class="panel-green" x="555" y="290" width="290" height="135"/>
  <text class="small-label" x="580" y="327">Learned behavior</text>
  <text class="small" x="580" y="357">PPO can learn speed-specific</text>
  <text class="small" x="580" y="382">movement, fleeing, chasing,</text>
  <text class="small" x="580" y="407">and energy-use strategies</text>

  <rect class="panel-amber" x="1020" y="105" width="290" height="135"/>
  <text class="small-label" x="1045" y="142">Ecological fitness</text>
  <text class="small" x="1045" y="172">survival, grass intake, predation,</text>
  <text class="small" x="1045" y="197">energy balance, offspring count</text>
  <text class="small" x="1045" y="222">filter which genomes reproduce</text>

  <rect class="panel-blue" x="1020" y="290" width="290" height="135"/>
  <text class="small-label" x="1045" y="327">Offspring inheritance</text>
  <text class="small" x="1045" y="357">parent speed genome</text>
  <text class="small" x="1045" y="382">+ bounded mutation</text>
  <text class="small" x="1045" y="407">fixed starting energy</text>

  <path class="arrow-blue" d="M 380 160 C 445 160 490 158 552 158"/>
  <text class="tiny muted" x="420" y="144">heritable trait becomes observable/mechanical</text>

  <path class="arrow-green" d="M 700 240 L 700 285"/>
  <text class="tiny muted" x="716" y="270">within-lifetime learning</text>

  <path class="arrow-amber" d="M 845 360 C 910 360 955 180 1018 180"/>
  <text class="tiny muted" x="900" y="267">behavior affects payoff</text>

  <path class="arrow-blue" d="M 1165 240 L 1165 285"/>
  <text class="tiny muted" x="1182" y="270">reproduction</text>

  <path class="arrow-blue" d="M 1020 360 C 870 500 520 500 380 360"/>
  <text class="tiny muted" x="600" y="532">only the genome crosses the generational boundary</text>

  <path class="dash-red" d="M 845 395 C 950 475 1050 472 1150 425"/>
  <text class="tiny" x="905" y="476" fill="#9a3f44">not transmitted in the base model: acquired PPO policy weights</text>
  <line x1="1114" y1="434" x2="1162" y2="386" stroke="#9a3f44" stroke-width="4"/>
  <line x1="1114" y1="386" x2="1162" y2="434" stroke="#9a3f44" stroke-width="4"/>

  <rect class="panel" x="70" y="570" width="390" height="90"/>
  <text class="small-label" x="95" y="604">Pure Darwinian treatment</text>
  <text class="small" x="95" y="632">Speed affects movement and fitness,</text>
  <text class="small" x="95" y="655">but the policy is blind to genome value.</text>

  <rect class="panel-green" x="505" y="570" width="390" height="90"/>
  <text class="small-label" x="530" y="604">Baldwinian treatment</text>
  <text class="small" x="530" y="632">Policy conditions on speed and cadence,</text>
  <text class="small" x="530" y="655">amplifying selection on heritable speed.</text>

  <rect class="panel-red" x="940" y="570" width="390" height="90"/>
  <text class="small-label" x="965" y="604">Lamarckian analogue</text>
  <text class="small" x="965" y="632">Would copy trained policy state or</text>
  <text class="small" x="965" y="655">checkpoint weights into descendants.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1884" viewBox="0 0 1320 1884" role="img" aria-labelledby="title desc">
  <title id="title">Retained Benefit simulation step flowchart</title>
  <desc id="desc">A blue publication-style flowchart showing one retained-benefit simulation step: start from the current lattice, compute gross output and private cost, split the output into open and retained shares, distribute benefits, compute fitness, choose local parents by fitness, copy lineage and cooperation trait with optional mutation, replace the lattice synchronously, then recompute statistics for the next step.</desc>
  <style>
    .canvas { fill: #ffffff; }
    .panelWhite { fill: #eaf2fb; stroke: #d6e4f5; stroke-width: 3; }
    .panelBlue { fill: #eaf2fb; stroke: #d6e4f5; stroke-width: 3; }
    .panelStripe { fill: #eaf2fb; stroke: #d6e4f5; stroke-width: 3; }
    .accent { fill: #0f3368; }
    .stepBadge { fill: #1c4b8f; }
    .badgeText {
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 22px;
      font-weight: 700;
      fill: #ffffff;
    }
    .stepTitle {
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 22px;
      font-weight: 700;
      fill: #0f3368;
    }
    .bodyText {
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 18px;
      font-weight: 400;
      fill: #1f2d3d;
    }
    .formulaText {
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 18px;
      font-weight: 700;
      fill: #1c4b8f;
    }
    .formulaSub { font-size: 72%; baseline-shift: sub; }
    .formulaSup { font-size: 68%; baseline-shift: super; }
    .smallText {
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 16px;
      font-weight: 400;
      fill: #415a77;
    }
    .noteBox { fill: #eaf2fb; stroke: #d6e4f5; stroke-width: 2; }
    .noteTitle {
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #0f3368;
    }
    .noteText {
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 13px;
      font-weight: 400;
      fill: #1f2d3d;
    }
    .arrow { stroke: #1c4b8f; stroke-width: 5; fill: none; stroke-linecap: square; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1c4b8f"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1320" height="1884"/>

  <rect class="panelBlue" x="180" y="50" width="980" height="116"/>
  <rect class="accent" x="180" y="50" width="18" height="116"/>
  <rect class="stepBadge" x="220" y="78" width="56" height="56"/>
  <text class="badgeText" x="248" y="114" text-anchor="middle">1</text>
  <text class="stepTitle" x="308" y="102">Start from the current lattice state</text>
  <text class="bodyText" x="308" y="136">Each occupied site stores one cooperation trait h and one inherited lineage label.</text>

  <path class="arrow" d="M 670 166 L 670 220" marker-end="url(#arrowhead)"/>

  <rect class="panelWhite" x="180" y="238" width="980" height="128"/>
  <rect class="accent" x="180" y="238" width="18" height="128"/>
  <rect class="stepBadge" x="220" y="274" width="56" height="56"/>
  <text class="badgeText" x="248" y="310" text-anchor="middle">2</text>
  <text class="stepTitle" x="308" y="288">Compute gross output and private cost for every producer site</text>
  <text class="formulaText" x="308" y="318">B<tspan class="formulaSub">i</tspan> = b × h<tspan class="formulaSub">i</tspan></text>
  <text class="formulaText" x="308" y="342">C<tspan class="formulaSub">i</tspan> = c × h<tspan class="formulaSub">i</tspan></text>
  <text class="smallText" x="308" y="360">Both terms depend only on the current trait h; cost is subtracted later in the fitness expression.</text>

  <path class="arrow" d="M 670 366 L 670 420" marker-end="url(#arrowhead)"/>

  <rect class="panelStripe" x="180" y="438" width="980" height="154"/>
  <rect class="accent" x="180" y="438" width="18" height="154"/>
  <rect class="stepBadge" x="220" y="476" width="56" height="56"/>
  <text class="badgeText" x="248" y="512" text-anchor="middle">3</text>
  <text class="stepTitle" x="308" y="494">Split each producer's output into open and retained shares</text>
  <text class="formulaText" x="308" y="530">B<tspan class="formulaSub">i</tspan><tspan class="formulaSup">retained</tspan> = r × B<tspan class="formulaSub">i</tspan></text>
  <text class="formulaText" x="308" y="560">B<tspan class="formulaSub">i</tspan><tspan class="formulaSup">open</tspan> = (1 − r) × B<tspan class="formulaSub">i</tspan></text>
  <text class="smallText" x="308" y="584">Open benefit can leak across the full neighborhood. Retained benefit is protected by lineage matching.</text>

  <path class="arrow" d="M 670 592 L 670 646" marker-end="url(#arrowhead)"/>

  <rect class="panelBlue" x="180" y="664" width="980" height="186"/>
  <rect class="accent" x="180" y="664" width="18" height="186"/>
  <rect class="stepBadge" x="220" y="702" width="56" height="56"/>
  <text class="badgeText" x="248" y="738" text-anchor="middle">4</text>
  <text class="stepTitle" x="308" y="720">Accumulate neighborhood receipts</text>
  <text class="bodyText" x="308" y="754">Open share is distributed equally across all sites in the producer's local neighborhood.</text>
  <text class="bodyText" x="308" y="788">Retained share contributes to accumulated retained benefit for same-lineage recipients.</text>
  <text class="smallText" x="308" y="822">This pass visits every producer site and sums what each destination site receives.</text>

  <rect class="noteBox" x="30" y="714" width="80" height="80"/>
  <text class="noteTitle" x="70" y="738" text-anchor="middle">Loop</text>
  <text class="noteText" x="70" y="758" text-anchor="middle">all</text>
  <text class="noteText" x="70" y="774" text-anchor="middle">producer</text>
  <text class="noteText" x="70" y="790" text-anchor="middle">sites</text>
  <path class="arrow" d="M 110 754 L 180 754" marker-end="url(#arrowhead)"/>

  <path class="arrow" d="M 670 850 L 670 904" marker-end="url(#arrowhead)"/>

  <rect class="panelWhite" x="180" y="922" width="980" height="140"/>
  <rect class="accent" x="180" y="922" width="18" height="140"/>
  <rect class="stepBadge" x="220" y="958" width="56" height="56"/>
  <text class="badgeText" x="248" y="994" text-anchor="middle">5</text>
  <text class="stepTitle" x="308" y="976">Compute site fitness on the current grid</text>
  <text class="formulaText" x="308" y="1012">W<tspan class="formulaSub">i</tspan> = w<tspan class="formulaSub">0</tspan> + received_open<tspan class="formulaSub">i</tspan> + received_retained<tspan class="formulaSub">i</tspan> − C<tspan class="formulaSub">i</tspan></text>
  <text class="smallText" x="308" y="1044">Fitness is clamped to a small positive floor before parent selection.</text>

  <path class="arrow" d="M 670 1062 L 670 1116" marker-end="url(#arrowhead)"/>

  <rect class="panelStripe" x="180" y="1134" width="980" height="186"/>
  <rect class="accent" x="180" y="1134" width="18" height="186"/>
  <rect class="stepBadge" x="220" y="1172" width="56" height="56"/>
  <text class="badgeText" x="248" y="1208" text-anchor="middle">6</text>
  <text class="stepTitle" x="308" y="1190">For each destination site, sample one local parent by fitness</text>
  <text class="bodyText" x="308" y="1224">Parent choice is restricted to the destination site's own local neighborhood.</text>
  <text class="bodyText" x="308" y="1258">Selection probability is proportional to the current neighborhood fitness values.</text>
  <text class="smallText" x="308" y="1292">This local replacement lottery is the model's selection step.</text>

  <rect class="noteBox" x="1230" y="1182" width="80" height="80"/>
  <text class="noteTitle" x="1270" y="1206" text-anchor="middle">Loop</text>
  <text class="noteText" x="1270" y="1226" text-anchor="middle">all</text>
  <text class="noteText" x="1270" y="1242" text-anchor="middle">destination</text>
  <text class="noteText" x="1270" y="1258" text-anchor="middle">sites</text>
  <path class="arrow" d="M 1160 1222 L 1230 1222" marker-end="url(#arrowhead)"/>

  <path class="arrow" d="M 670 1320 L 670 1374" marker-end="url(#arrowhead)"/>

  <rect class="panelBlue" x="180" y="1392" width="980" height="214"/>
  <rect class="accent" x="180" y="1392" width="18" height="214"/>
  <rect class="stepBadge" x="220" y="1430" width="56" height="56"/>
  <text class="badgeText" x="248" y="1466" text-anchor="middle">7</text>
  <text class="stepTitle" x="308" y="1448">Copy the chosen parent's lineage and cooperation trait</text>
  <text class="bodyText" x="308" y="1484">Lineage is copied directly. Trait h is copied with optional Gaussian mutation</text>
  <text class="bodyText" x="308" y="1518">and then clipped to [0, 1].</text>
  <text class="smallText" x="308" y="1552">Parent lookup uses the old grid; offspring are written into separate next-step arrays.</text>

  <path class="arrow" d="M 670 1606 L 670 1660" marker-end="url(#arrowhead)"/>

  <rect class="panelWhite" x="180" y="1678" width="980" height="182"/>
  <rect class="accent" x="180" y="1678" width="18" height="182"/>
  <rect class="stepBadge" x="220" y="1716" width="56" height="56"/>
  <text class="badgeText" x="248" y="1752" text-anchor="middle">8</text>
  <text class="stepTitle" x="308" y="1734">Replace the lattice synchronously, recompute fitness, and record history</text>
  <text class="smallText" x="308" y="1770">The new grid becomes step t + 1. The model then records mean cooperation, mean fitness,</text>
  <text class="smallText" x="308" y="1802">assortment, dominant-lineage share, and lineage count.</text>
</svg>

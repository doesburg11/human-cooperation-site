<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1410" viewBox="0 0 1320 1410" role="img" aria-labelledby="title desc">
  <title id="title">Kin Selection simulation step flowchart</title>
  <desc id="desc">A blue publication-style flowchart showing one kin-selection simulation step: start from the current grid, compute cooperative output and private cost, build the kin-weighted routing kernel, accumulate lineage-weighted receipts, compute fitness, then sample a local parent by softmax over fitness and replace the grid synchronously.</desc>
  <style>
    .canvas { fill: #ffffff; }
    .panelWhite  { fill: #eaf2fb; stroke: #d6e4f5; stroke-width: 3; }
    .panelBlue   { fill: #eaf2fb; stroke: #d6e4f5; stroke-width: 3; }
    .panelStripe { fill: #eaf2fb; stroke: #d6e4f5; stroke-width: 3; }
    .accent    { fill: #0f3368; }
    .stepBadge { fill: #1c4b8f; }
    .badgeText {
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 22px;
      font-weight: 700;
      fill: #ffffff;
    }
    .stepTitle {
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 22px;
      font-weight: 700;
      fill: #0f3368;
    }
    .bodyText {
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 18px;
      font-weight: 400;
      fill: #1f2d3d;
    }
    .smallText {
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 16px;
      font-weight: 400;
      fill: #415a77;
    }
    .arrow { stroke: #1c4b8f; stroke-width: 5; fill: none; stroke-linecap: square; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1c4b8f"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1320" height="1410"/>

  <!-- Panel 1: Start -->
  <rect class="panelBlue" x="180" y="50" width="980" height="116"/>
  <rect class="accent" x="180" y="50" width="18" height="116"/>
  <rect class="stepBadge" x="220" y="78" width="56" height="56"/>
  <text class="badgeText" x="248" y="114" text-anchor="middle">1</text>
  <text class="stepTitle" x="308" y="102">Start from the current grid state</text>
  <text class="bodyText" x="308" y="136">Each site stores one cooperation trait h and one inherited lineage label.</text>

  <path class="arrow" d="M 670 166 L 670 220" marker-end="url(#arrowhead)"/>

  <!-- Panel 2: Production -->
  <rect class="panelWhite" x="180" y="238" width="980" height="140"/>
  <rect class="accent" x="180" y="238" width="18" height="140"/>
  <rect class="stepBadge" x="220" y="274" width="56" height="56"/>
  <text class="badgeText" x="248" y="310" text-anchor="middle">2</text>
  <text class="stepTitle" x="308" y="292">Compute cooperative output and private cost</text>
  <text class="bodyText" x="308" y="326">Each site's output and cost both scale proportionally with its cooperation trait.</text>
  <text class="smallText" x="308" y="360">B_plus_scale sets the output magnitude; C_scale sets the cost magnitude.</text>

  <path class="arrow" d="M 670 378 L 670 432" marker-end="url(#arrowhead)"/>

  <!-- Panel 3: Kernel Construction -->
  <rect class="panelStripe" x="180" y="450" width="980" height="220"/>
  <rect class="accent" x="180" y="450" width="18" height="220"/>
  <rect class="stepBadge" x="220" y="486" width="56" height="56"/>
  <text class="badgeText" x="248" y="522" text-anchor="middle">3</text>
  <text class="stepTitle" x="308" y="504">Build the kin-weighted routing kernel</text>
  <text class="bodyText" x="308" y="538">For each producer, assign a raw weight to every neighbor based on lineage match:</text>
  <text class="bodyText" x="308" y="572">same-lineage neighbors receive w_same; other-lineage neighbors receive w_other.</text>
  <text class="bodyText" x="308" y="606">Row-normalize so each producer's outgoing weights sum to 1.</text>
  <text class="smallText" x="308" y="642">Defaults: w_same = 0.8 and w_other = 0.2. Raising w_same increases effective relatedness.</text>

  <path class="arrow" d="M 670 670 L 670 724" marker-end="url(#arrowhead)"/>

  <!-- Panel 4: Routing -->
  <rect class="panelBlue" x="180" y="742" width="980" height="154"/>
  <rect class="accent" x="180" y="742" width="18" height="154"/>
  <rect class="stepBadge" x="220" y="778" width="56" height="56"/>
  <text class="badgeText" x="248" y="814" text-anchor="middle">4</text>
  <text class="stepTitle" x="308" y="796">Accumulate lineage-weighted receipts</text>
  <text class="bodyText" x="308" y="830">Each site receives the kin-weighted sum of cooperative benefit from its neighbors.</text>
  <text class="smallText" x="308" y="868">Same-lineage cooperators exchange more benefit, reinforcing cooperative clusters over time.</text>

  <path class="arrow" d="M 670 896 L 670 950" marker-end="url(#arrowhead)"/>

  <!-- Panel 5: Fitness -->
  <rect class="panelWhite" x="180" y="968" width="980" height="128"/>
  <rect class="accent" x="180" y="968" width="18" height="128"/>
  <rect class="stepBadge" x="220" y="1004" width="56" height="56"/>
  <text class="badgeText" x="248" y="1040" text-anchor="middle">5</text>
  <text class="stepTitle" x="308" y="1022">Compute site fitness</text>
  <text class="bodyText" x="308" y="1056">Fitness = baseline fitness + received benefit − private cost.</text>
  <text class="smallText" x="308" y="1082">Baseline fitness w_0 prevents negative fitness and dampens selection intensity.</text>

  <path class="arrow" d="M 670 1096 L 670 1150" marker-end="url(#arrowhead)"/>

  <!-- Panel 6: Local Replacement -->
  <rect class="panelStripe" x="180" y="1168" width="980" height="220"/>
  <rect class="accent" x="180" y="1168" width="18" height="220"/>
  <rect class="stepBadge" x="220" y="1204" width="56" height="56"/>
  <text class="badgeText" x="248" y="1240" text-anchor="middle">6</text>
  <text class="stepTitle" x="308" y="1222">For each site, sample a local parent by softmax over fitness</text>
  <text class="bodyText" x="308" y="1256">Parent selection is restricted to the site's local neighborhood.</text>
  <text class="bodyText" x="308" y="1290">The offspring inherits the chosen parent's trait h (with small Gaussian mutation)</text>
  <text class="bodyText" x="308" y="1324">and lineage label — same-lineage clusters grow when cooperators reproduce locally.</text>
  <text class="smallText" x="308" y="1358">This synchronous replacement completes one Moran step; the grid becomes step t + 1.</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="580" viewBox="0 0 1300 580" role="img" aria-labelledby="title desc">
  <title id="title">Maslow's Hierarchy and the Path to Cooperation</title>
  <desc id="desc">A five-layer pyramid from Physiological at the base up through Safety, Belonging and Cooperation, Esteem, to Self-Actualization at the apex, colored in a light-to-dark blue gradient. A left callout links the Physiological base layer to the PredPreyGrass simulations, and another left callout links the Belonging and Cooperation layer to this site's cooperation research.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel-soft { fill: #eaf2fb; stroke: #d6e4f5; stroke-width: 2; }
      .band { stroke: #0f3368; stroke-width: 1.5; }
      .band-highlight { stroke: #1c4b8f; stroke-width: 3.5; }
      .connector { stroke: #7f9bc2; stroke-width: 1.5; fill: none; }
      .label-title {
        fill: #0f3368;
        font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
        font-size: 22px;
        font-weight: 700;
      }
      .callout-title {
        fill: #0f3368;
        font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
        font-size: 19px;
        font-weight: 700;
      }
      .callout-body {
        fill: #4e6279;
        font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 400;
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1300" height="580"/>

  <!-- Pyramid bands, apex (550,50) to base (200,520)-(900,520) -->
  <polygon class="band" points="550,50 620,144 480,144" fill="#eaf2fb"/>
  <polygon class="band" points="480,144 620,144 690,238 410,238" fill="#cfe0f5"/>
  <polygon class="band band-highlight" points="410,238 690,238 760,332 340,332" fill="#a9c8ec"/>
  <polygon class="band" points="340,332 760,332 830,426 270,426" fill="#5f85bc"/>
  <polygon class="band" points="270,426 830,426 900,520 200,520" fill="#0f3368"/>

  <!-- Right-side connector lines and labels -->
  <path class="connector" d="M 584 97 L 940 97"/>
  <text class="label-title" x="950" y="103">Self-Actualization</text>

  <path class="connector" d="M 655 191 L 940 191"/>
  <text class="label-title" x="950" y="197">Esteem</text>

  <path class="connector" d="M 725 285 L 940 285"/>
  <text class="label-title" x="950" y="291">Belonging &amp; Cooperation</text>

  <path class="connector" d="M 795 379 L 940 379"/>
  <text class="label-title" x="950" y="385">Safety</text>

  <path class="connector" d="M 865 473 L 940 473"/>
  <text class="label-title" x="950" y="479">Physiological</text>

  <!-- Left callouts -->
  <path class="connector" d="M 375 285 L 260 285"/>
  <rect class="panel-soft" x="20" y="210" width="240" height="150"/>
  <text class="callout-title" x="40" y="242">Cooperation</text>
  <text class="callout-body" x="40" y="270">
    <tspan x="40" dy="0">Once survival needs are met,</tspan>
    <tspan x="40" dy="22">agents can share resources,</tspan>
    <tspan x="40" dy="22">form alliances, and coordinate</tspan>
    <tspan x="40" dy="22">action — this site's focus.</tspan>
  </text>

  <path class="connector" d="M 235 473 L 260 473"/>
  <rect class="panel-soft" x="20" y="398" width="240" height="150"/>
  <text class="callout-title" x="40" y="430">PredPreyGrass</text>
  <text class="callout-body" x="40" y="458">
    <tspan x="40" dy="0">Prey seek grass, predators</tspan>
    <tspan x="40" dy="22">hunt prey: agents driven</tspan>
    <tspan x="40" dy="22">purely by the physiological</tspan>
    <tspan x="40" dy="22">need to obtain energy.</tspan>
  </text>
</svg>

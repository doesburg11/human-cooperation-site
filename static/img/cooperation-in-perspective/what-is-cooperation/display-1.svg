<svg width="900" height="340" viewBox="0 0 900 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Estimated relative division of cooperative time</title>
  <desc id="desc">A blue-styled pie chart showing mutual accommodation at 15 percent, active support at 15 percent, shared coordination at 45 percent, and norm-sustaining cooperation at 25 percent.</desc>

  <rect width="900" height="340" fill="#FFFFFF"/>

  <circle cx="228" cy="160" r="130" fill="#EAF2FB" stroke="#D6E4F5" stroke-width="2"/>
  <path d="M228 160 L228 30 A130 130 0 0 1 351.634 117.023 Z" fill="#78AAE6"/>
  <path d="M228 160 L351.634 117.023 A130 130 0 0 1 304.435 265.337 Z" fill="#5F93D3"/>
  <path d="M228 160 L304.435 265.337 A130 130 0 0 1 98 160 Z" fill="#0F3368"/>
  <path d="M228 160 L98 160 A130 130 0 0 1 228 30 Z" fill="#1C4B8F"/>
  <circle cx="228" cy="160" r="3.5" fill="#0F3368"/>

  <rect x="392" y="46" width="492" height="46" fill="#0F3368"/>
  <text x="420" y="75" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Form of broad cooperation</text>
  <text x="853" y="75" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Share</text>

  <rect x="392" y="92" width="492" height="52" fill="#FFFFFF" stroke="#D6E4F5"/>
  <rect x="392" y="144" width="492" height="52" fill="#EAF2FB" stroke="#D6E4F5"/>
  <rect x="392" y="196" width="492" height="52" fill="#FFFFFF" stroke="#D6E4F5"/>
  <rect x="392" y="248" width="492" height="52" fill="#EAF2FB" stroke="#D6E4F5"/>

  <rect x="418" y="108" width="16" height="16" fill="#78AAE6"/>
  <rect x="418" y="160" width="16" height="16" fill="#5F93D3"/>
  <rect x="418" y="212" width="16" height="16" fill="#0F3368"/>
  <rect x="418" y="264" width="16" height="16" fill="#1C4B8F"/>

  <text x="448" y="122" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1F2D3D">Mutual accommodation</text>
  <text x="448" y="174" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1F2D3D">Active support</text>
  <text x="448" y="226" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1F2D3D">Shared coordination</text>
  <text x="448" y="278" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1F2D3D">Norm-sustaining cooperation</text>

  <text x="853" y="122" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0F3368">15%</text>
  <text x="853" y="174" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0F3368">15%</text>
  <text x="853" y="226" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0F3368">45%</text>
  <text x="853" y="278" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0F3368">25%</text>

  <text x="16" y="327" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2D3D">Provisional empirical working estimate inferred from time-use and social-interaction data.</text>
</svg>
